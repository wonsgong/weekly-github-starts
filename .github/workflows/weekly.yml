name: Weekly GitHub Trending

on:
  schedule:
    - cron: '40 6 * * 3'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-github-trending-pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      report-commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Collect and validate the current week
        id: report
        run: |
          report=$(python3 scripts/collect.py)
          echo "path=$report" >> "$GITHUB_OUTPUT"
      - name: Collect the two skill leaderboards
        run: |
          for board in skill-leaderboard skills-sh; do
            if ! python3 scripts/collect_skills.py "$board"; then
              echo "::warning::Could not refresh $board. Existing snapshots have been kept."
            fi
          done
      - name: Prepare Korean fonts
        id: fonts
        continue-on-error: true
        run: |
          if [[ -z "$(fc-list :lang=ko)" ]]; then
            sudo apt-get update
            sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Generate weekly card news
        if: steps.fonts.outcome == 'success'
        continue-on-error: true
        env:
          REPORT: ${{ steps.report.outputs.path }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          week=$(basename "$REPORT")
          for report in "$REPORT" "reports/skill-leaderboard/$week" "reports/skills-sh/$week"; do
            if [[ -f "$report" ]] && ! python3 scripts/generate_cards.py "$report"; then
              echo "::warning::Could not make cards for $report."
            fi
          done
      - name: Commit the report and any completed cards
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPORT: ${{ steps.report.outputs.path }}
        run: |
          git add -- "$REPORT"
          week=$(basename "$REPORT" .json)
          if [[ -d "card-news/$week" ]]; then
            git add -- "card-news/$week"
          fi
          for board in skill-leaderboard skills-sh; do
            if [[ -f "reports/$board/$week.json" ]]; then
              git add -- "reports/$board/$week.json"
            fi
            if [[ -d "card-news/$board/$week" ]]; then
              git add -- "card-news/$board/$week"
            fi
          done
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m '[update] 주간 트렌드 리포트와 카드뉴스 갱신' \
                       -m '- GitHub Trending과 스킬 순위의 주차별 스냅샷 및 완성된 카드뉴스 반영'
            git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      teams-payload: ${{ steps.teams.outputs.payload }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.collect.outputs.report-commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build the static site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build.py --base-url "$PAGES_URL"
      - name: Prepare Teams image renderer
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null && find dist -name 00-cover.png -print -quit | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Prepare Teams notification
        id: teams
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          payload=$(python3 scripts/teams_payload.py --base-url "$PAGES_URL" --all-sources)
          printf '%s\n' "payload=$payload" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  notify-teams:
    needs: [build, deploy]
    if: needs.deploy.result == 'success' && needs.build.outputs.teams-payload != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send weekly Teams notification
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TEAMS_PAYLOAD: ${{ needs.build.outputs.teams-payload }}
        run: |
          if [[ -z "$TEAMS_WEBHOOK_URL" ]]; then
            echo 'TEAMS_WEBHOOK_URL is missing. Skipping notification.'
            exit 0
          fi
          messages=$(jq -c '.attachments[] | {type: "message", attachments: [.]}' <<< "$TEAMS_PAYLOAD")
          result=0
          while IFS= read -r message; do
            if ! status=$(curl --silent --proto '=https' --connect-timeout 10 --max-time 30 \
                --output /dev/null --write-out '%{http_code}' \
                --json "$message" --url "$TEAMS_WEBHOOK_URL"); then
              echo '::error::Teams webhook request could not be completed.'
              result=1
            elif [[ "$status" != 2[0-9][0-9] ]]; then
              echo "::error::Teams webhook returned HTTP $status."
              result=1
            else
              echo "Teams webhook accepted the request (HTTP $status)."
            fi
          done <<< "$messages"
          exit "$result"
