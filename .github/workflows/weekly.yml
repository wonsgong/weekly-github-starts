name: Weekly GitHub Trending

on:
  schedule:
    - cron: '40 6 * * 3'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-github-trending-pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      report-commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Collect and validate the current week
        id: report
        run: |
          report=$(python3 scripts/collect.py)
          echo "path=$report" >> "$GITHUB_OUTPUT"
      - name: Prepare Korean fonts
        id: fonts
        continue-on-error: true
        run: |
          if [[ -z "$(fc-list :lang=ko)" ]]; then
            sudo apt-get update
            sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Generate weekly card news
        if: steps.fonts.outcome == 'success'
        continue-on-error: true
        env:
          REPORT: ${{ steps.report.outputs.path }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 scripts/generate_cards.py "$REPORT"
      - name: Commit the report and any completed cards
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPORT: ${{ steps.report.outputs.path }}
        run: |
          git add -- "$REPORT"
          week=$(basename "$REPORT" .json)
          if [[ -d "card-news/$week" ]]; then
            git add -- "card-news/$week"
          fi
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Update weekly GitHub Trending report and cards'
            git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.collect.outputs.report-commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build the static site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build.py --base-url "$PAGES_URL"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
